<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Artigo</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;max-width:800px;}
  textarea,input{width:100%;margin:10px 0;padding:5px;}
  #resultado{border:1px solid #ccc;padding:10px;margin-top:10px;}
</style>
</head>
<body>
<h1>Gerador de Artigo</h1>
<textarea id="outline" rows="6" placeholder="Outlines (uma por linha)"></textarea>
<input id="keyword" placeholder="Palavra-chave principal"/>
<textarea id="customPrompt" rows="4" placeholder="Prompt opcional"></textarea>
<button id="gerar">Gerar Artigo</button>
<div id="progresso"></div>
<div id="resultado"></div>
<button id="copiar" style="display:none;">Copiar HTML</button>
<button id="baixar" style="display:none;">Baixar HTML (.html)</button>
<script>
document.getElementById('gerar').onclick = async () => {
  const outline = document.getElementById('outline').value;
  const keyword = document.getElementById('keyword').value;
  const customPrompt = document.getElementById('customPrompt').value;
  document.getElementById('progresso').textContent = 'Enviando...';
  document.getElementById('resultado').innerHTML = '';
  document.getElementById('copiar').style.display = 'none';
  document.getElementById('baixar').style.display = 'none';
  const res = await fetch('/gerar-artigo', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({outline, keyword, customPrompt})
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let finalHtml = '';
  while(true){
    const { value, done } = await reader.read();
    if(done) break;
    const chunk = decoder.decode(value);
    chunk.trim().split(/\n\n/).forEach(line => {
      if(line.startsWith('data:')){
        const data = JSON.parse(line.replace('data:','').trim());
        if(data.progress){
          document.getElementById('progresso').textContent = `Gerando tópico ${data.progress} de ${data.total}...`;
        }
        if(data.complete){
          finalHtml = data.html;
        }
        if(data.error){
          document.getElementById('progresso').textContent = data.error;
        }
      }
    });
  }
  if(finalHtml){
    document.getElementById('resultado').innerHTML = finalHtml;
    document.getElementById('copiar').style.display = '';
    document.getElementById('baixar').style.display = '';
    document.getElementById('progresso').textContent = 'Concluído!';
  }
};

document.getElementById('copiar').onclick = () => {
  const html = document.getElementById('resultado').innerHTML;
  navigator.clipboard.writeText(html);
};

document.getElementById('baixar').onclick = () => {
  const html = document.getElementById('resultado').innerHTML;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'artigo.html';
  a.click();
};
</script>
</body>
</html>
